[project]
name = "gunggeum-stt"
version = "0.1.0"
description = "궁금(宮今) 실시간 해설 자막: 음성 구간 검출 → Amazon Transcribe → 후처리 사전 → Amazon Translate → 카드 링크"
requires-python = ">=3.12"
dependencies = [
    "amazon-transcribe>=0.6",
    "boto3>=1.34",
    "numpy>=1.26",
    "onnxruntime>=1.17",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "redis>=5", "websockets>=12"]
bench = ["soundfile>=0.12", "websockets>=12"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "soundfile>=0.12"]

[tool.setuptools]
packages = ["gunggeum_stt"]

[tool.setuptools.package-data]
gunggeum_stt = ["data/*.json", "data/*.csv", "data/*.onnx", "data/*.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
